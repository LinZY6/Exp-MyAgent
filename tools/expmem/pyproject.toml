[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expmem"
version = "0.1.0"
description = "Standalone experiment memory: literature lookup, BM25 retrieval, deduped recording"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
expmem = "expmem.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
