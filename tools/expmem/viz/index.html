<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>expmem graph</title>
  <style>
    :root {
      --bg: #121317;
      --panel: #1b1c22;
      --line: #2c2e36;
      --text: #e6e4df;
      --muted: #9a968c;
      --accent: #d4a056;
      --baseline: #6ea8ff;
      --ablation: #e0a54b;
      --add: #5dbe8d;
      --change: #c084fc;
      --other: #8b9099;
      --improved: #5dbe8d;
      --regressed: #e06c75;
      --failed: #e06c75;
      --flat: #8b9099;
      --planned: #6ea8ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
    .status { color: var(--muted); font-size: 12px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; min-width: 0; }
    aside { overflow: auto; padding: 14px 16px 24px; background: var(--panel); min-width: 280px; }
    header h1 { margin: 0 12px 0 0; font-size: 14px; font-weight: 650; letter-spacing: 0.04em; }
    header h1 span { color: var(--accent); }
    .grow { flex: 1; min-width: 180px; }
    input[type="text"], input[type="search"] {
      width: 100%; background: #121317; border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; outline: none;
    }
    input:focus { border-color: #4a4e5a; }
    .btn {
      background: #23242c; border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; white-space: nowrap;
    }
    .btn:hover { background: #2b2d36; }
    .btn-accent { background: #2b2418; border-color: #5a4630; color: var(--accent); }
    .file { position: relative; overflow: hidden; }
    .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    #chiprow {
      display: flex; gap: 10px; align-items: center;
      padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    #chiprow #q { width: 200px; flex: 0 0 200px; }
    .chip {
      border: 1px solid var(--line); background: #121317; border-radius: 999px;
      padding: 3px 10px; color: var(--muted);
    }
    .chip.on { border-color: var(--accent); color: var(--accent); }
    .status.err { color: var(--regressed); }
    #stage {
      position: relative; overflow: hidden; border-right: 1px solid var(--line);
    }
    #stage.empty .hint { display: flex; }
    .hint {
      display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
      color: var(--muted); text-align: center; padding: 24px; pointer-events: none;
    }
    svg { width: 100%; height: 100%; display: block; }
    .edge { fill: none; stroke: #4a4e5a; stroke-width: 1.4; marker-end: url(#arrow); }
    .edge.on { stroke: var(--accent); stroke-width: 2.2; }
    .edge.dim { opacity: 0.18; }
    .node { cursor: pointer; }
    .node rect { stroke-width: 1.5; }
    .node .id { font: 600 12px "Cascadia Mono", "Consolas", monospace; fill: var(--text); }
    .node .sub { font: 11px "Segoe UI", sans-serif; fill: var(--muted); }
    .node.dim { opacity: 0.18; }
    .node.sel rect { stroke: #fff; stroke-width: 2.2; }
    .node.ghost rect { stroke-dasharray: 4 3; fill: #1b1c22; }
    aside h2 { margin: 0 0 8px; font-size: 13px; font-family: "Cascadia Mono", Consolas, monospace; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { border-radius: 4px; padding: 1px 7px; font-size: 11px; border: 1px solid var(--line); }
    .k { color: var(--muted); font-size: 11px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .v { white-space: pre-wrap; word-break: break-word; }
    .v.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 3px 0; vertical-align: top; }
    td.k2 { color: var(--muted); width: 72px; }
    .legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 11px; pointer-events: none; }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
    .empty-side { color: var(--muted); }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 40vh; }
      #stage { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>expmem <span>graph</span></h1>
      <label class="btn file">导入 JSONL
        <input id="file" type="file" accept=".jsonl,.json,.txt,application/json" />
      </label>
      <div class="grow">
        <input id="addr" type="text" placeholder="JSONL 地址：http(s)://… 或本地路径 / collection 名" />
      </div>
      <button class="btn btn-accent" id="load">加载</button>
      <span class="status" id="msg">导入 experiments.jsonl，或填地址</span>
    </header>
    <div id="chiprow">
      <div class="chips" id="chips"></div>
      <input id="q" type="search" placeholder="高亮检索…" />
    </div>
    <main>
      <div id="stage" class="empty">
        <div class="hint">
          节点 = 一次实验 · 边 = upstream（父 → 子）<br />
          支持 JSONL / JSON 数组。本地路径请用 <code>python -m expmem viz</code>，或直接导入文件。
        </div>
        <svg id="svg">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4e5a" />
            </marker>
            <marker id="arrowOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a056" />
            </marker>
          </defs>
          <g id="world"></g>
        </svg>
        <div class="legend">
          <span><i style="background:var(--baseline)"></i>baseline</span>
          <span><i style="background:var(--ablation)"></i>ablation</span>
          <span><i style="background:var(--add)"></i>add_module</span>
          <span><i style="background:var(--change)"></i>change_module</span>
          <span>边框 = verdict</span>
        </div>
      </div>
      <aside id="side"><p class="empty-side">点选节点查看 rationale / change / 论文 / 预期 vs 实际</p></aside>
    </main>
  </div>
  <script>
    const KIND_FILL = {
      baseline: "#1d2a40",
      ablation: "#3a2e1c",
      add_module: "#1c3328",
      change_module: "#2d2240",
      other: "#23242c",
    };
    const KIND_STROKE = {
      baseline: "#6ea8ff",
      ablation: "#e0a54b",
      add_module: "#5dbe8d",
      change_module: "#c084fc",
      other: "#8b9099",
    };
    const VERDICT = {
      improved: "#5dbe8d",
      regressed: "#e06c75",
      failed: "#e06c75",
      flat: "#8b9099",
      planned: "#6ea8ff",
    };

    const state = {
      nodes: [],
      pos: {},
      selected: null,
      query: "",
      view: { x: 40, y: 40, k: 1 },
      dragging: null,
      panning: null,
    };

    const svg = document.getElementById("svg");
    const world = document.getElementById("world");
    const stage = document.getElementById("stage");
    const side = document.getElementById("side");
    const msg = document.getElementById("msg");
    const chips = document.getElementById("chips");

    function setMsg(text, err) {
      msg.textContent = text;
      msg.className = "status" + (err ? " err" : "");
    }

    function parentsOf(n) {
      const raw = n.upstream_ids || n.upstream || [];
      return (Array.isArray(raw) ? raw : String(raw).split(",")).map((x) => String(x).trim()).filter(Boolean);
    }

    function parseDatabase(text) {
      const raw = String(text || "").replace(/^\uFEFF/, "").trim();
      if (!raw) throw new Error("文件为空");
      if (raw[0] === "[") {
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) throw new Error("JSON 不是数组");
        return arr;
      }
      if (raw[0] === "{") {
        try {
          const obj = JSON.parse(raw);
          if (Array.isArray(obj.nodes)) return obj.nodes;
          if (obj.id) return [obj];
        } catch (_) { /* fall through to jsonl */ }
      }
      const rows = [];
      raw.split(/\r?\n/).forEach((line, i) => {
        const t = line.trim();
        if (!t) return;
        try { rows.push(JSON.parse(t)); }
        catch (e) { throw new Error("第 " + (i + 1) + " 行不是合法 JSON"); }
      });
      if (!rows.length) throw new Error("没有读到节点");
      return rows;
    }

    function normalize(rows) {
      const seen = new Map();
      rows.forEach((raw, i) => {
        const id = String(raw.id || raw.experiment_id || ("node_" + i));
        const papers = (raw.papers || []).map((p) => {
          if (typeof p === "string") return { paper_id: p.startsWith("arxiv:") ? p : "", title: p.startsWith("arxiv:") ? "" : p };
          return { paper_id: p.paper_id || p.id || "", title: p.title || "" };
        });
        seen.set(id, {
          id,
          kind: raw.kind || "other",
          status: raw.status || "planned",
          fingerprint: raw.fingerprint || "",
          upstream_ids: parentsOf(raw),
          papers,
          rationale: raw.rationale || "",
          change: raw.change || "",
          expected: raw.expected || {},
          actual: raw.actual || null,
          ghost: false,
        });
      });
      const missing = new Set();
      seen.forEach((n) => n.upstream_ids.forEach((p) => { if (!seen.has(p)) missing.add(p); }));
      missing.forEach((id) => {
        seen.set(id, { id, kind: "other", status: "planned", fingerprint: "", upstream_ids: [], papers: [], rationale: "(库中缺失的上游)", change: "", expected: {}, actual: null, ghost: true });
      });
      return [...seen.values()];
    }

    function layout(nodes) {
      const byId = new Map(nodes.map((n) => [n.id, n]));
      const rank = {};
      function getRank(id, stack) {
        if (rank[id] != null) return rank[id];
        if (stack.has(id)) return 0;
        stack.add(id);
        const n = byId.get(id);
        const ps = (n ? n.upstream_ids : []).filter((p) => byId.has(p));
        rank[id] = ps.length ? Math.max(...ps.map((p) => getRank(p, stack))) + 1 : 0;
        stack.delete(id);
        return rank[id];
      }
      nodes.forEach((n) => getRank(n.id, new Set()));
      const levels = [];
      nodes.forEach((n) => {
        const r = rank[n.id] || 0;
        (levels[r] ||= []).push(n);
      });
      for (let pass = 0; pass < 4; pass++) {
        levels.forEach((row) => {
          row.sort((a, b) => {
            const avg = (n) => {
              const ps = n.upstream_ids.map((p) => levels[rank[p]] ? levels[rank[p]].indexOf(byId.get(p)) : 0);
              return ps.length ? ps.reduce((s, x) => s + x, 0) / ps.length : 0;
            };
            return avg(a) - avg(b) || a.id.localeCompare(b.id);
          });
        });
      }
      const W = 248, H = 118, padX = 48, padY = 56;
      const pos = {};
      const maxW = Math.max(...levels.map((r) => r.length), 1);
      levels.forEach((row, i) => {
        const offset = ((maxW - row.length) * W) / 2;
        row.forEach((n, j) => {
          pos[n.id] = { x: padX + offset + j * W, y: padY + i * H };
        });
      });
      return pos;
    }

    function verdictOf(n) {
      if (n.status === "failed") return "failed";
      return (n.actual && n.actual.verdict) || (n.status === "planned" ? "planned" : "") || "";
    }

    function paperBlob(n) {
      return (n.papers || []).map((p) => [p.paper_id, p.title].filter(Boolean).join(" ")).join(" ");
    }

    function searchText(n) {
      return [n.id, n.kind, n.change, n.rationale, paperBlob(n), (n.expected && n.expected.note) || ""].join(" ").toLowerCase();
    }

    function matchesQuery(n) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      return q.split(/\s+/).every((tok) => searchText(n).includes(tok));
    }

    function related(id) {
      const set = new Set([id]);
      const byId = new Map(state.nodes.map((n) => [n.id, n]));
      (function up(x) {
        const n = byId.get(x);
        (n ? n.upstream_ids : []).forEach((p) => { if (!set.has(p)) { set.add(p); up(p); } });
      })(id);
      state.nodes.forEach((n) => {
        if (n.upstream_ids.includes(id)) set.add(n.id);
      });
      return set;
    }

    function el(name, attrs, kids) {
      const n = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
      (kids || []).forEach((c) => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return n;
    }

    function trunc(s, n) {
      s = String(s || "");
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    function applyView() {
      world.setAttribute("transform", `translate(${state.view.x} ${state.view.y}) scale(${state.view.k})`);
    }

    function render() {
      world.innerHTML = "";
      const NW = 220, NH = 78;
      const hit = state.query.trim() ? new Set(state.nodes.filter(matchesQuery).map((n) => n.id)) : null;
      const rel = state.selected ? related(state.selected) : null;

      state.nodes.forEach((n) => {
        n.upstream_ids.forEach((pid) => {
          if (!state.pos[pid] || !state.pos[n.id]) return;
          const a = state.pos[pid], b = state.pos[n.id];
          const x1 = a.x + NW / 2, y1 = a.y + NH;
          const x2 = b.x + NW / 2, y2 = b.y;
          const mid = (y1 + y2) / 2;
          const on = rel && rel.has(n.id) && rel.has(pid);
          const dim = (hit && (!hit.has(n.id) || !hit.has(pid))) || (rel && !on);
          const path = el("path", {
            d: `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`,
            class: "edge" + (on ? " on" : "") + (dim ? " dim" : ""),
            "marker-end": on ? "url(#arrowOn)" : "url(#arrow)",
          });
          world.appendChild(path);
        });
      });

      state.nodes.forEach((n) => {
        const p = state.pos[n.id];
        if (!p) return;
        const kind = KIND_STROKE[n.kind] ? n.kind : "other";
        const v = verdictOf(n);
        const g = el("g", { class: "node" + (n.id === state.selected ? " sel" : "") + ((hit && !hit.has(n.id)) || (rel && !rel.has(n.id)) ? " dim" : "") + (n.ghost ? " ghost" : ""), "data-id": n.id });
        g.appendChild(el("rect", {
          x: p.x, y: p.y, width: NW, height: NH, rx: 8,
          fill: KIND_FILL[kind],
          stroke: VERDICT[v] || KIND_STROKE[kind],
        }));
        g.appendChild(el("text", { class: "id", x: p.x + 12, y: p.y + 22 }, [trunc(n.id, 26)]));
        g.appendChild(el("text", { class: "sub", x: p.x + 12, y: p.y + 42 }, [trunc(n.kind + (v ? " · " + v : ""), 32)]));
        g.appendChild(el("text", { class: "sub", x: p.x + 12, y: p.y + 60 }, [trunc(n.change || n.rationale, 34)]));
        g.addEventListener("mousedown", (ev) => {
          ev.stopPropagation();
          state.selected = n.id;
          state.dragging = { id: n.id, x: ev.clientX, y: ev.clientY, ox: p.x, oy: p.y };
          showCard(n);
          render();
        });
        world.appendChild(g);
      });
      applyView();
      stage.classList.toggle("empty", !state.nodes.length);
    }

    function fmtOutcome(o) {
      if (!o) return "—";
      const bits = [];
      if (o.note) bits.push(o.note);
      if (o.verdict) bits.push("verdict=" + o.verdict);
      if (o.delta != null && o.delta !== "") bits.push("delta=" + o.delta);
      if (o.error) bits.push("error=" + o.error);
      const metrics = o.metrics || {};
      Object.keys(metrics).forEach((k) => bits.push(k + "=" + metrics[k]));
      return bits.join("\n") || "—";
    }

    function showCard(n) {
      const papers = (n.papers || []).map((p) => p.paper_id || p.title).filter(Boolean);
      side.innerHTML =
        "<h2>" + esc(n.id) + "</h2>" +
        '<div class="meta">' +
          tag(n.kind) + tag(n.status) + (verdictOf(n) ? tag(verdictOf(n)) : "") +
        "</div>" +
        row("upstream", (n.upstream_ids || []).join(", ") || "—") +
        row("papers", papers.join("\n") || "—", true) +
        row("rationale", n.rationale || "—") +
        row("change", n.change || "—") +
        row("expected", fmtOutcome(n.expected), true) +
        row("actual", fmtOutcome(n.actual), true) +
        row("fingerprint", n.fingerprint || "—", true);
    }

    function tag(t) { return '<span class="tag">' + esc(t) + "</span>"; }
    function row(k, v, mono) {
      return '<div class="k">' + esc(k) + '</div><div class="v' + (mono ? " mono" : "") + '">' + esc(v) + "</div>";
    }
    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function loadNodes(rows, label) {
      state.nodes = normalize(rows);
      state.pos = layout(state.nodes);
      state.selected = null;
      state.view = { x: 40, y: 40, k: 1 };
      side.innerHTML = '<p class="empty-side">点选节点查看 rationale / change / 论文 / 预期 vs 实际</p>';
      const n = state.nodes.filter((n) => !n.ghost).length;
      const short = String(label || "已加载").replace(/\\/g, "/").split("/").filter(Boolean).slice(-2).join("/");
      setMsg(short + " · " + n + " 个实验");
      render();
    }

    function looksLocalPath(s) {
      return /^[a-zA-Z]:[\\/]/.test(s) || s.startsWith("\\\\") || (s.startsWith("/") && !s.startsWith("//")) || s.startsWith("./") || s.startsWith(".\\");
    }

    async function loadFromAddress(addr) {
      const a = (addr || "").trim();
      if (!a) throw new Error("请输入地址");
      if (looksLocalPath(a) || (!/^https?:/i.test(a) && !a.startsWith("/api/"))) {
        const r = await fetch("/api/open?path=" + encodeURIComponent(a));
        if (!r.ok) {
          const t = await r.text();
          throw new Error(r.status === 404
            ? "本地路径需要先运行 python -m expmem viz，或改用「导入 JSONL」。" + (t ? " (" + t + ")" : "")
            : t || r.statusText);
        }
        loadNodes(parseDatabase(await r.text()), a);
        return;
      }
      const r = await fetch(a);
      if (!r.ok) throw new Error("读取失败 " + r.status);
      loadNodes(parseDatabase(await r.text()), a);
    }

    async function bootCollections() {
      try {
        const r = await fetch("/api/collections");
        if (!r.ok) return;
        const list = await r.json();
        if (!list.length) return;
        chips.style.display = "flex";
        chips.innerHTML = "";
        list.forEach((c) => {
          const b = document.createElement("button");
          b.className = "chip";
          b.textContent = c.id + " (" + c.nodes + ")";
          b.onclick = async () => {
            [...chips.children].forEach((x) => x.classList.remove("on"));
            b.classList.add("on");
            document.getElementById("addr").value = c.id;
            try { await loadFromAddress(c.id); }
            catch (e) { setMsg(e.message, true); }
          };
          chips.appendChild(b);
        });
      } catch (_) { /* file:// 打开时没有服务 */ }
    }

    document.getElementById("file").addEventListener("change", async (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      try { loadNodes(parseDatabase(await f.text()), f.name); }
      catch (e) { setMsg(e.message, true); }
    });

    document.getElementById("load").addEventListener("click", async () => {
      try { await loadFromAddress(document.getElementById("addr").value); }
      catch (e) { setMsg(e.message, true); }
    });
    document.getElementById("addr").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") document.getElementById("load").click();
    });
    document.getElementById("q").addEventListener("input", (ev) => {
      state.query = ev.target.value;
      render();
    });

    stage.addEventListener("mousedown", (ev) => {
      if (ev.target.closest(".node")) return;
      state.panning = { x: ev.clientX, y: ev.clientY, ox: state.view.x, oy: state.view.y };
    });
    window.addEventListener("mousemove", (ev) => {
      if (state.dragging) {
        const d = state.dragging;
        const k = state.view.k || 1;
        state.pos[d.id] = { x: d.ox + (ev.clientX - d.x) / k, y: d.oy + (ev.clientY - d.y) / k };
        render();
      } else if (state.panning) {
        const p = state.panning;
        state.view.x = p.ox + (ev.clientX - p.x);
        state.view.y = p.oy + (ev.clientY - p.y);
        applyView();
      }
    });
    window.addEventListener("mouseup", () => { state.dragging = null; state.panning = null; });
    stage.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const k = state.view.k * (ev.deltaY > 0 ? 0.9 : 1.1);
      state.view.k = Math.max(0.25, Math.min(3, k));
      applyView();
    }, { passive: false });

    stage.addEventListener("dragover", (ev) => { ev.preventDefault(); });
    stage.addEventListener("drop", async (ev) => {
      ev.preventDefault();
      const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
      if (!f) return;
      try { loadNodes(parseDatabase(await f.text()), f.name); }
      catch (e) { setMsg(e.message, true); }
    });

    const params = new URLSearchParams(location.search);
    bootCollections().then(async () => {
      const src = params.get("src") || params.get("src_url") || params.get("path");
      if (src) {
        document.getElementById("addr").value = src;
        try { await loadFromAddress(src); } catch (e) { setMsg(e.message, true); }
      }
    });
  </script>
</body>
</html>
