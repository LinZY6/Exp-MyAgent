<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent 会话查阅</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #1b1c22;
      --line: #2c2e36;
      --text: #e6e4df;
      --muted: #9a968c;
      --accent: #d4a056;
      --chat: #14151b;
      --user: #5b9dff;
      --experimenter: #f0b429;
      --designer: #3dcc9a;
      --design: #2ec4d6;
      --patch: #c084fc;
      --divergence: #ff8c42;
      --paper: #7aa2ff;
      --gate: #8b9099;
      --tool: #8b9099;
      --err: #e06c75;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    header h1 { margin: 0 8px 0 0; font-size: 14px; font-weight: 650; }
    header h1 span { color: var(--accent); }
    .btn {
      background: #23242c; border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; white-space: nowrap;
    }
    .btn:hover { background: #2b2d36; }
    .btn.on { border-color: var(--accent); color: var(--accent); }
    input[type="search"], input[type="text"] {
      background: #121317; border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 10px; outline: none; min-width: 160px;
    }
    .file { position: relative; overflow: hidden; }
    .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .status { color: var(--muted); font-size: 12px; }
    .status.err { color: var(--err); }
    main { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 0; }
    #sessions {
      overflow: auto; border-right: 1px solid var(--line); background: var(--panel);
      padding: 8px;
    }
    .sess {
      display: block; width: 100%; text-align: left; background: transparent;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    .sess:hover { background: #23242c; }
    .sess.on { border-color: var(--accent); background: #2b2418; }
    .sess .when { color: var(--muted); font-size: 11px; }
    .sess .prev { color: var(--text); margin-top: 4px; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #stage { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
    #filters {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 14px; border-bottom: 1px solid var(--line);
    }
    .chip {
      border: 1px solid var(--line); background: #121317; border-radius: 999px;
      padding: 3px 10px; color: var(--muted);
    }
    .chip.on { color: var(--text); border-color: currentColor; }
    .chip[data-role="user"].on { color: var(--user); }
    .chip[data-role="experimenter"].on { color: var(--experimenter); }
    .chip[data-role="experiment-designer"].on { color: var(--designer); }
    .chip[data-role="design-reviewer"].on { color: var(--design); }
    .chip[data-role="patch-reviewer"].on { color: var(--patch); }
    .chip[data-role="divergence-reviewer"].on { color: var(--divergence); }
    .chip[data-role="paper-reviewer"].on { color: var(--paper); }
    #log {
      overflow: auto; padding: 18px 16px 40px;
      background: var(--chat);
      background-image: radial-gradient(ellipse at top, #1a1c24 0%, transparent 55%);
    }
    .hint { color: var(--muted); text-align: center; padding: 48px 16px; }
    .turn {
      display: flex; gap: 10px; align-items: flex-start;
      width: 100%; margin: 0 0 14px; padding: 0 12px;
    }
    .turn.cont { margin-top: -8px; }
    .turn.cont .avatar { visibility: hidden; }
    .turn.cont .who { visibility: hidden; height: 0; margin: 0; overflow: hidden; }
    .turn.user { flex-direction: row-reverse; }
    .turn.sel .card { box-shadow: 0 0 0 1px var(--accent); }
    .avatar {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 750; font-size: 14px; color: #121317; letter-spacing: 0;
    }
    .col { min-width: 0; max-width: min(620px, calc(100% - 50px)); }
    .turn.cont { margin-top: -8px; }
    .turn.cont .avatar { visibility: hidden; }
    .turn.cont .who { visibility: hidden; height: 0; margin: 0; overflow: hidden; }
    .turn.user { flex-direction: row-reverse; }
    .turn.sel .card { box-shadow: 0 0 0 1px var(--accent); }
    .avatar {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 750; font-size: 14px; color: #121317; letter-spacing: 0;
    }
    .col { min-width: 0; max-width: calc(100% - 50px); }
    .turn.user .col { display: flex; flex-direction: column; align-items: flex-end; }
    .who { font-size: 12px; color: var(--muted); margin: 0 2px 5px; }
    .who b { font-weight: 650; color: var(--who, var(--text)); }
    .card {
      display: inline-block; max-width: 100%;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px;
      padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
      box-shadow: 0 1px 0 rgba(0,0,0,.25);
    }
    .turn.user .card {
      border-radius: 14px 4px 14px 14px;
      background: #1e4a9a;
      border-color: #2b6fd6;
      color: #f4f7ff;
    }
    .turn[data-agent="experimenter"] .card {
      background: color-mix(in srgb, var(--experimenter) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--experimenter) 42%, var(--line));
    }
    .turn[data-agent="experiment-designer"] .card {
      background: color-mix(in srgb, var(--designer) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--designer) 42%, var(--line));
    }
    .turn[data-agent="design-reviewer"] .card {
      background: color-mix(in srgb, var(--design) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--design) 42%, var(--line));
    }
    .turn[data-agent="patch-reviewer"] .card {
      background: color-mix(in srgb, var(--patch) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--patch) 42%, var(--line));
    }
    .turn[data-agent="divergence-reviewer"] .card {
      background: color-mix(in srgb, var(--divergence) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--divergence) 42%, var(--line));
    }
    .turn[data-agent="paper-reviewer"] .card {
      background: color-mix(in srgb, var(--paper) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--paper) 42%, var(--line));
    }
    .turn[data-agent="protocol-gate"] .card {
      background: color-mix(in srgb, var(--gate) 16%, var(--panel));
      border-color: color-mix(in srgb, var(--gate) 42%, var(--line));
    }
    .think {
      color: var(--muted); font-size: 12px; border-left: 2px solid var(--line);
      padding: 4px 0 4px 10px; margin-bottom: 8px; white-space: pre-wrap;
    }
    .tool {
      margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: #14151a;
    }
    .tool summary {
      list-style: none; cursor: pointer; padding: 8px 10px; display: flex;
      gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .tool summary::-webkit-details-marker { display: none; }
    .name { font-family: "Cascadia Mono", Consolas, monospace; font-weight: 650; }
    .path { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
    .role {
      font-size: 10px; border-radius: 999px; padding: 1px 8px; border: 1px solid currentColor;
    }
    .role.experimenter { color: var(--experimenter); }
    .role.experiment-designer { color: var(--designer); }
    .role.design-reviewer { color: var(--design); }
    .role.patch-reviewer { color: var(--patch); }
    .role.divergence-reviewer { color: var(--divergence); }
    .role.paper-reviewer { color: var(--paper); }
    .role.protocol-gate { color: var(--gate); }
    .role.user { color: var(--user); }
    .legend {
      display: flex; flex-wrap: wrap; gap: 8px 12px; width: 100%;
      color: var(--muted); font-size: 11px; margin-top: 2px;
    }
    .legend i {
      display: inline-block; width: 8px; height: 8px; border-radius: 2px;
      margin-right: 4px; vertical-align: middle;
    }
    .pre {
      margin: 0; padding: 8px 10px 10px; border-top: 1px solid var(--line);
      font: 12px/1.4 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap;
      color: #c8c5bc; max-height: 320px; overflow: auto;
    }
    #nav {
      display: flex; gap: 8px; align-items: center; padding: 8px 14px;
      border-top: 1px solid var(--line); background: var(--panel);
    }
    #nav .grow { flex: 1; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Agent <span>群聊</span></h1>
      <label class="btn file">打开 JSONL<input id="file" type="file" accept=".jsonl,.json" multiple /></label>
      <button class="btn" id="reload" type="button">刷新会话列表</button>
      <input id="q" type="search" placeholder="搜索文本 / 工具名 / 路径" />
      <span class="status" id="status">从左侧选一场 Pi 会话，或打开 ~/.pi/agent/sessions 里的 jsonl。</span>
    </header>
    <main>
      <aside id="sessions"></aside>
      <section id="stage">
        <div id="filters"></div>
        <div id="log"></div>
        <div id="nav">
          <button class="btn" id="prev" type="button">上一步 (K)</button>
          <button class="btn" id="next" type="button">下一步 (J)</button>
          <span class="grow" id="pos"></span>
        </div>
      </section>
    </main>
  </div>
  <script>
    const ROLE_FROM_SKILL = {
      "experiment-agent": "experimenter",
      "experiment-designer": "experiment-designer",
      "design-reviewer": "design-reviewer",
      "patch-reviewer": "patch-reviewer",
      "divergence-reviewer": "divergence-reviewer",
      "paper-reviewer": "paper-reviewer",
    };
    const ROLE_META = {
      user: { label: "用户", short: "我", color: "#5b9dff", bubble: "#1a3f86", border: "#3d7be8" },
      experimenter: { label: "实验者", short: "实", color: "#f0b429", bubble: "#2c2618", border: "#7a5c1e" },
      "experiment-designer": { label: "设计者", short: "设", color: "#3dcc9a", bubble: "#17332a", border: "#2a8a68" },
      "design-reviewer": { label: "设计审查", short: "审", color: "#2ec4d6", bubble: "#153238", border: "#1e7f8c" },
      "patch-reviewer": { label: "补丁审查", short: "补", color: "#c084fc", bubble: "#2a1d38", border: "#7a4fb0" },
      "divergence-reviewer": { label: "发散审查", short: "散", color: "#ff8c42", bubble: "#332218", border: "#a85a28" },
      "paper-reviewer": { label: "论文对照", short: "论", color: "#7aa2ff", bubble: "#1a2744", border: "#3d5aa8" },
      "protocol-gate": { label: "协议闸门", short: "闸", color: "#8b9099", bubble: "#24262c", border: "#5a5e66" },
    };
    const ROLE_LABEL = Object.fromEntries(Object.entries(ROLE_META).map(([k, v]) => [k, v.label]));
    const FILTERS = [
      "all", "user", "experimenter", "experiment-designer",
      "design-reviewer", "patch-reviewer", "divergence-reviewer", "paper-reviewer", "reviews",
    ];
    const NAME_PREFIX = [
      ["experiment-designer", "experiment-designer"],
      ["designer-clarify", "experiment-designer"],
      ["designer", "experiment-designer"],
      ["design-reviewer", "design-reviewer"],
      ["patch-reviewer", "patch-reviewer"],
      ["divergence-reviewer", "divergence-reviewer"],
      ["paper-reviewer", "paper-reviewer"],
      ["protocol-gate", "protocol-gate"],
      ["design", "design-reviewer"],
      ["patch", "patch-reviewer"],
      ["divergence", "divergence-reviewer"],
      ["paper", "paper-reviewer"],
    ];

    function roleMeta(id) {
      return ROLE_META[id] || {
        label: id || "?",
        short: String(id || "?").slice(0, 1),
        color: "#8b9099",
        bubble: "#24262c",
        border: "#3a3d46",
      };
    }

    const state = {
      sessions: [],
      rel: "",
      turns: [],
      steps: [],
      filter: "all",
      query: "",
      cursor: 0,
    };

    const el = {
      sessions: document.getElementById("sessions"),
      log: document.getElementById("log"),
      status: document.getElementById("status"),
      filters: document.getElementById("filters"),
      pos: document.getElementById("pos"),
      q: document.getElementById("q"),
    };

    function normPath(p) {
      return String(p || "").replace(/\\/g, "/");
    }

    function skillRole(path) {
      const m = normPath(path).toLowerCase().match(/skills\/([^/]+)\/skill\.md$/);
      if (!m) return null;
      return ROLE_FROM_SKILL[m[1]] || null;
    }

    function roleFromFilename(name) {
      const base = String(name || "").toLowerCase().replace(/\.(md|json)$/, "");
      for (const [pre, role] of NAME_PREFIX) {
        if (base === pre || base.startsWith(pre + "-")) return role;
      }
      return null;
    }

    function fileRole(path) {
      const n = normPath(path).toLowerCase();
      const hit = n.match(/reviews\/(?:verdicts|packets)\/([^/]+)$/);
      if (hit) return roleFromFilename(hit[1]);
      return skillRole(path);
    }

    function isReviewPath(path) {
      const n = normPath(path).toLowerCase();
      return n.includes("/reviews/") || Boolean(skillRole(path));
    }

    function firstText(content) {
      if (typeof content === "string") return content;
      if (!Array.isArray(content)) return "";
      const texts = [];
      for (const part of content) {
        if (!part || typeof part !== "object") continue;
        if (part.type === "text" || part.text) texts.push(String(part.text || ""));
      }
      return texts.join("\n");
    }

    function pretty(value) {
      if (value == null) return "";
      if (typeof value === "string") {
        try { return JSON.stringify(JSON.parse(value), null, 2); }
        catch { return value; }
      }
      try { return JSON.stringify(value, null, 2); }
      catch { return String(value); }
    }

    function argPath(args) {
      if (!args || typeof args !== "object") return "";
      return args.path || args.file || args.title || args.action || args.rel || "";
    }

    function parseSession(text) {
      const lines = String(text).split(/\r?\n/);
      const meta = { cwd: "", model: "", id: "" };
      const raw = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        let obj;
        try { obj = JSON.parse(line); } catch { continue; }
        const typ = obj.type;
        if (typ === "session") {
          meta.cwd = obj.cwd || "";
          meta.id = obj.id || "";
          continue;
        }
        if (typ === "model_change") {
          meta.model = obj.modelId || obj.model || "";
          continue;
        }
        if (typ !== "message" && obj.role) {
          raw.push(obj);
          continue;
        }
        if (typ === "message") raw.push(obj);
      }
      const results = {};
      for (const obj of raw) {
        const msg = obj.message || obj;
        if ((msg.role || obj.role) === "toolResult" || obj.toolCallId) {
          const id = msg.toolCallId || obj.toolCallId;
          if (id) results[id] = firstText(msg.content || obj.content) || pretty(msg.details || obj.details);
        }
      }
      let current = "experimenter";
      const turns = [];
      for (const obj of raw) {
        const msg = obj.message || obj;
        const role = msg.role || obj.role;
        if (role === "toolResult") continue;
        if (role === "user") {
          turns.push({
            id: obj.id || ("u-" + turns.length),
            ts: obj.timestamp || "",
            kind: "user",
            agent: "user",
            text: firstText(msg.content),
            thinking: "",
            tools: [],
          });
          continue;
        }
        if (role !== "assistant") continue;
        const content = Array.isArray(msg.content) ? msg.content : [];
        let thinking = "";
        let text = "";
        const tools = [];
        let turnAgent = current;
        for (const part of content) {
          if (!part || typeof part !== "object") continue;
          if (part.type === "thinking") thinking = String(part.thinking || part.text || "");
          if (part.type === "text") text += (text ? "\n" : "") + String(part.text || "");
          if (part.type === "toolCall") {
            const args = part.arguments || {};
            const path = argPath(args);
            const tagged = fileRole(path);
            const hat = skillRole(path);
            if (hat) {
              current = hat;
              turnAgent = hat;
            }
            if (tagged && normPath(path).toLowerCase().includes("/reviews/verdicts/")) {
              current = "experimenter";
            }
            const agent = tagged || current;
            tools.push({
              id: part.id,
              name: part.name || "",
              args,
              path,
              result: results[part.id] || "",
              agent,
              review: isReviewPath(path) || /verdict|packet|reviewer/i.test(part.name || ""),
            });
          }
        }
        turns.push({
          id: obj.id || ("a-" + turns.length),
          ts: obj.timestamp || "",
          kind: "assistant",
          agent: turnAgent || current,
          text,
          thinking,
          tools,
        });
      }
      return { meta, turns };
    }

    function stepsOf(turns) {
      const steps = [];
      for (const turn of turns) {
        if (turn.kind === "user" || turn.text || turn.thinking) {
          steps.push({ type: "turn", turn });
        }
        for (const tool of turn.tools || []) {
          steps.push({ type: "tool", turn, tool });
        }
      }
      return steps;
    }

    function visibleTurns() {
      const q = state.query.trim().toLowerCase();
      return state.turns.filter((turn) => {
        if (state.filter === "reviews") {
          const hit = turn.tools.some((t) => t.review);
          if (!hit) return false;
        } else if (state.filter !== "all") {
          const hit = turn.agent === state.filter || turn.tools.some((t) => t.agent === state.filter);
          if (!hit) return false;
        }
        if (!q) return true;
        const blob = [
          turn.text, turn.thinking, turn.agent,
          ...turn.tools.map((t) => t.name + " " + t.path + " " + pretty(t.args) + " " + t.result),
        ].join("\n").toLowerCase();
        return blob.includes(q);
      });
    }

    function setStatus(text, err) {
      el.status.textContent = text;
      el.status.classList.toggle("err", Boolean(err));
    }

    function elText(tag, text, cls) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      node.textContent = text;
      return node;
    }

    function renderFilters() {
      el.filters.replaceChildren();
      for (const id of FILTERS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (state.filter === id ? " on" : "");
        btn.dataset.role = id;
        btn.textContent = id === "all" ? "全部" : id === "reviews" ? "仅审查" : (ROLE_LABEL[id] || id);
        btn.addEventListener("click", () => {
          state.filter = id;
          state.cursor = 0;
          renderLog();
          renderFilters();
        });
        el.filters.appendChild(btn);
      }
      const legend = document.createElement("div");
      legend.className = "legend";
      for (const [id, meta] of Object.entries(ROLE_META)) {
        if (id === "protocol-gate") continue;
        const span = document.createElement("span");
        const dot = document.createElement("i");
        dot.style.background = meta.color;
        span.appendChild(dot);
        span.appendChild(document.createTextNode(meta.label));
        legend.appendChild(span);
      }
      el.filters.appendChild(legend);
    }

    function renderSessions() {
      el.sessions.replaceChildren();
      if (!state.sessions.length) {
        el.sessions.appendChild(elText("div", "没有从服务器列出会话。仍可点「打开 JSONL」。", "hint"));
        return;
      }
      for (const sess of state.sessions) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sess" + (sess.rel === state.rel ? " on" : "");
        const when = new Date((sess.mtime || 0) * 1000);
        const t = Number.isNaN(when.getTime()) ? sess.name : when.toLocaleString();
        btn.appendChild(elText("div", t, "when"));
        btn.appendChild(elText("div", sess.preview || sess.name, "prev"));
        btn.addEventListener("click", () => loadRel(sess.rel));
        el.sessions.appendChild(btn);
      }
    }

    function renderLog() {
      const turns = visibleTurns();
      el.log.replaceChildren();
      if (!turns.length) {
        el.log.appendChild(elText("div", "没有可显示的步骤。打开一场会话，或放宽筛选。", "hint"));
        el.pos.textContent = "";
        state.steps = [];
        return;
      }
      let lastAgent = "";
      for (const turn of turns) {
        const agent = turn.kind === "user" ? "user" : (turn.agent || "experimenter");
        const meta = roleMeta(agent);
        const wrap = document.createElement("div");
        wrap.className = "turn " + turn.kind + (agent === lastAgent ? " cont" : "");
        wrap.dataset.id = turn.id;
        wrap.dataset.agent = agent;
        wrap.style.setProperty("--who", meta.color);

        const av = document.createElement("div");
        av.className = "avatar";
        av.textContent = meta.short;
        av.style.background = meta.color;

        const col = document.createElement("div");
        col.className = "col";
        const who = document.createElement("div");
        who.className = "who";
        const b = document.createElement("b");
        b.textContent = meta.label;
        who.appendChild(b);
        const ts = String(turn.ts || "");
        if (ts) who.appendChild(document.createTextNode("  " + ts.replace("T", " ").replace("Z", " UTC")));
        col.appendChild(who);

        const card = document.createElement("div");
        card.className = "card";
        card.style.background = meta.bubble;
        card.style.borderColor = meta.border;
        if (turn.thinking) {
          const det = document.createElement("details");
          det.className = "think";
          const sum = document.createElement("summary");
          sum.textContent = "思考";
          det.appendChild(sum);
          det.appendChild(document.createTextNode(turn.thinking));
          card.appendChild(det);
        }
        if (turn.text) card.appendChild(elText("div", turn.text));
        for (const tool of turn.tools) {
          const box = document.createElement("details");
          box.className = "tool";
          box.dataset.step = tool.id;
          const sum = document.createElement("summary");
          const name = elText("span", tool.name, "name");
          const badge = elText("span", ROLE_LABEL[tool.agent] || tool.agent, "role " + tool.agent);
          sum.appendChild(name);
          sum.appendChild(badge);
          if (tool.path) sum.appendChild(elText("span", String(tool.path), "path"));
          box.appendChild(sum);
          const pre = document.createElement("pre");
          pre.className = "pre";
          const body = "arguments\n" + pretty(tool.args) + (tool.result ? "\n\nresult\n" + tool.result : "");
          pre.textContent = body.length > 12000 ? body.slice(0, 12000) + "\n…(截断)" : body;
          box.appendChild(pre);
          card.appendChild(box);
        }
        col.appendChild(card);
        wrap.appendChild(av);
        wrap.appendChild(col);
        el.log.appendChild(wrap);
        lastAgent = agent;
      }
      state.steps = [];
      for (const turn of turns) {
        for (const tool of turn.tools) state.steps.push(tool.id);
        if (!turn.tools.length) state.steps.push(turn.id);
      }
      if (state.cursor >= state.steps.length) state.cursor = Math.max(0, state.steps.length - 1);
      highlight();
    }

    function highlight() {
      document.querySelectorAll(".turn.sel").forEach((n) => n.classList.remove("sel"));
      const id = state.steps[state.cursor];
      if (!id) {
        el.pos.textContent = "";
        return;
      }
      const tool = el.log.querySelector('[data-step="' + CSS.escape(id) + '"]');
      const turn = el.log.querySelector('[data-id="' + CSS.escape(id) + '"]');
      const node = tool ? tool.closest(".turn") : turn;
      if (node) {
        node.classList.add("sel");
        node.scrollIntoView({ block: "nearest" });
      }
      if (tool) tool.open = true;
      el.pos.textContent = (state.cursor + 1) + " / " + state.steps.length + " 步 · J/K 翻步";
    }

    function move(delta) {
      if (!state.steps.length) return;
      state.cursor = Math.max(0, Math.min(state.steps.length - 1, state.cursor + delta));
      highlight();
    }

    function applyParsed(parsed, label) {
      state.turns = parsed.turns;
      state.cursor = 0;
      const nTools = parsed.turns.reduce((n, t) => n + t.tools.length, 0);
      setStatus((label || "会话") + " · " + parsed.turns.length + " 轮 · " + nTools + " 次工具" +
        (parsed.meta.model ? " · " + parsed.meta.model : ""));
      renderLog();
    }

    async function loadRel(rel) {
      state.rel = rel;
      renderSessions();
      setStatus("正在读取…");
      try {
        const res = await fetch("/api/session?rel=" + encodeURIComponent(rel));
        if (!res.ok) throw new Error(await res.text());
        const text = await res.text();
        applyParsed(parseSession(text), rel);
      } catch (err) {
        setStatus(String(err.message || err), true);
      }
    }

    async function loadList() {
      try {
        const res = await fetch("/api/sessions");
        if (!res.ok) throw new Error("list failed");
        const data = await res.json();
        state.sessions = data.sessions || [];
        setStatus("会话目录 " + (data.root || "") + " · " + state.sessions.length + " 场");
        renderSessions();
        if (state.sessions.length && !state.turns.length) loadRel(state.sessions[0].rel);
      } catch {
        setStatus("未连上本地服务时，请用「打开 JSONL」导入 %USERPROFILE%\\.pi\\agent\\sessions 下的文件。");
        renderSessions();
      }
    }

    document.getElementById("file").addEventListener("change", async (ev) => {
      const files = [...ev.target.files];
      if (!files.length) return;
      const text = await files[0].text();
      state.rel = files[0].name;
      applyParsed(parseSession(text), files[0].name);
    });
    document.getElementById("reload").addEventListener("click", loadList);
    document.getElementById("prev").addEventListener("click", () => move(-1));
    document.getElementById("next").addEventListener("click", () => move(1));
    el.q.addEventListener("input", () => {
      state.query = el.q.value;
      state.cursor = 0;
      renderLog();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
      if (ev.key === "j" || ev.key === "J") move(1);
      if (ev.key === "k" || ev.key === "K") move(-1);
    });

    renderFilters();
    loadList();
  </script>
</body>
</html>
